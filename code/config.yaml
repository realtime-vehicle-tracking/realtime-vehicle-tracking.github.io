  - name: "Colliers Wood"
    lat_min: 51.3950
    lat_max: 51.4100
    lon_min: -0.2495
    lon_max: -0.1800
    color: [50, 205, 50]
    center_lat: 51.4183
    center_lon: -0.1779

  - name: "Mitcham"
    lat_min: 51.3950
    lat_max: 51.4100
    lon_min: -0.1800
    lon_max: -0.1245
    color: [220, 20, 60]
