# Vehicle Tracking System -- City Configuration
# London Borough of Merton
#
# The five zones are logical simplified zones used by the vehicle-tracking
# demonstration. They are NOT official neighborhood boundary polygons.
#
# The underlying OSM road network is the full London Borough of Merton,
# downloaded via OSMnx. The zone rectangles are a simplified abstraction
# used for vehicle dispatch, zone activity reporting and graph queries.
#
# center_lat / center_lon are verified road-network coordinates used for
# nearest-node lookup when computing shortest paths. They may fall outside
# the zone bounding box -- what matters is that they map to a real road node
# within the zone's road network.
#
# Intersections outside all zone boxes are assigned to Unknown automatically.
#
# The osmnx_place value must resolve via the Nominatim geocoder.
# Test with: ox.geocode_to_gdf(osmnx_place)

city:
  name: "London Borough of Merton"
  schema_name: "merton_vehicles"
  osmnx_place: "London Borough of Merton, UK"
  network_type: "drive"
  map_lat: 51.410
  map_lon: -0.188
  map_zoom: 12

zones:
  - name: "Wimbledon"
    lat_min: 51.4100
    lat_max: 51.4411
    lon_min: -0.2495
    lon_max: -0.1900
    color: [30, 144, 255]
    center_lat: 51.4215
    center_lon: -0.2064

  - name: "Raynes Park"
