# Vehicle Tracking System -- City Configuration
# San Francisco: Noe Valley, Castro, Glen Park, Bernal Heights, Visitacion Valley
#
# Road network loaded from a pre-clipped OSM file (sf-central-southeast.osm.pbf)
# downloaded from Geofabrik and clipped using pyrosm.
#
# Zones are logical simplified zones for the graph demo, not official
# San Francisco neighborhood boundary polygons.
#
# To regenerate the clipped file:
#   1. Download california-latest.osm.pbf from Geofabrik
#   2. Run 00_prepare_osm.ipynb

city:
  name: "San Francisco"
  schema_name: "sf_vehicles"
  osmnx_place: "Noe Valley, San Francisco, California"
  osm_file: "sf-central-southeast.osm.pbf"
  osm_bbox: [37.7016, 37.7649, -122.4577, -122.3923]  # south, north, west, east
  osm_source: "https://download.geofabrik.de/north-america/us/california-latest.osm.pbf"
  osm_source_file: "california-latest.osm.pbf"
  network_type: "drive"
  map_lat: 37.733
  map_lon: -122.425
  map_zoom: 13

