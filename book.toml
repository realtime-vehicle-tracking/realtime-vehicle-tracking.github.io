[book]
authors = ["Akmal Chaudhri"]
language = "en"
src = "src"
title = "Real-Time Vehicle Tracking with Neo4j, Databricks Lakebase and OpenStreetMap"
description = "A fleet operations demo using Neo4j, Databricks Lakebase and OpenStreetMap"

[output.html]
hash-files = true
git-repository-url = "https://github.com/realtime-vehicle-tracking/realtime-vehicle-tracking.github.io"
edit-url-template = "https://github.com/realtime-vehicle-tracking/realtime-vehicle-tracking.github.io/edit/main/src/{path}"
no-section-label = true

[output.html.search]
limit-results = 20
use-boolean-and = true
